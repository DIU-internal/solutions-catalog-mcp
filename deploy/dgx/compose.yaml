services:
  diu-catalog-mcp:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: diu-catalog-mcp:dgx
    container_name: diu-catalog-mcp
    restart: unless-stopped
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-8001}:8001"
    environment:
      PORT: "8001"
      DIU_MCP_API_KEY: "${DIU_MCP_API_KEY:-}"
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL


# Host nginx configuration for IP:port access.
# Public endpoint: http://DGX_IP:8080/mcp

upstream diu_catalog_mcp {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    access_log /var/log/nginx/diu-catalog-mcp.access.log;
    error_log /var/log/nginx/diu-catalog-mcp.error.log warn;

    client_max_body_size 2m;

    location = /health {
        proxy_pass http://diu_catalog_mcp/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ready {
        proxy_pass http://diu_catalog_mcp/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        proxy_pass http://diu_catalog_mcp;
        proxy_http_version 1.1;

        # Streamable HTTP may keep responses open; do not buffer or cache them.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
    }
}


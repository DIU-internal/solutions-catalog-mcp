[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diu-solutions-catalog-mcp"
version = "0.1.0"
description = "FastMCP server for searching and discovering DIU Commercial Solutions Catalog projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DIU Solutions Catalog MCP contributors" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastembed>=0.6,<1",
  "fastmcp>=2.12,<3",
  "httpx>=0.27,<1",
  "qdrant-client>=1.15,<2",
  "truststore>=0.10,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
diu-catalog-scrape = "diu_catalog_mcp.scraper:main"
diu-catalog-ingest = "diu_catalog_mcp.vector_store:main"
diu-catalog-mcp = "diu_catalog_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/diu_catalog_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
